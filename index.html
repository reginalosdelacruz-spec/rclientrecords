<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Client Record System (PHP - Enter Shortcuts & mm/dd/yy Formatting)</title>
  <style>
    body { font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif; margin: 30px; background-color: #f4f7f6; color: #333; }
    .container { max-width: 1250px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e9ecef; padding-bottom: 10px; margin-bottom: 20px; }
    h2, h3, h4 { color: #0056b3; margin: 0; }
    .auth-box { display: flex; gap: 8px; align-items: center; }
    .admin-only { display: none; }
    .form-section { background: #f8f9fa; padding: 15px; border-radius: 6px; border: 1px solid #e9ecef; margin-bottom: 20px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 10px; }
    .grid-service { display: grid; grid-template-columns: 2fr 1.5fr 1fr 2fr 40px; gap: 10px; margin-bottom: 8px; align-items: center; }
    input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; box-sizing: border-box; width: 100%; }
    .actions { display: flex; gap: 10px; margin-top: 15px; }
    button { padding: 8px 14px; border: none; background: #0056b3; color: white; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #004085; }
    button.btn-add-row { background: #17a2b8; padding: 5px 8px; font-size: 12px; margin-bottom: 10px; }
    button.btn-export { background: #28a745; }
    button.btn-danger { background: #dc3545; }
    button.btn-danger:hover { background: #c82333; }
    button.btn-small { padding: 4px 8px; font-size: 11px; margin-top: 5px; }
    .search-bar { margin-bottom: 15px; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #e0e0e0; padding: 10px; text-align: left; vertical-align: top; }
    th { background-color: #f8f9fa; }
    .service-item { border-bottom: 1px dashed #ddd; padding-bottom: 4px; margin-bottom: 4px; font-size: 13px; }
    .service-item:last-child { border-bottom: none; margin-bottom: 0; }
    .total-badge { font-weight: bold; color: #28a745; display: block; }
    .admin-active { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; padding: 5px 10px; border-radius: 4px; font-size: 12px; }
    .text-muted { color: #888; font-style: italic; }
    .service-tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .service-tag { background: #ffffff; border: 1px solid #ced4da; padding: 4px 8px; border-radius: 4px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
    .service-tag span { cursor: pointer; color: #dc3545; font-weight: bold; }
    details summary { cursor: pointer; font-weight: bold; color: #17a2b8; outline: none; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <h2>Client Record System (PHP)</h2>
    <div class="auth-box">
      <!-- Press Enter to Login -->
      <form id="loginForm" onsubmit="event.preventDefault(); loginAdmin();" style="display: flex; gap: 5px; margin: 0;">
        <input type="password" id="adminPassInput" placeholder="Admin Password" style="width: 140px;">
        <button type="submit">Login</button>
      </form>
      <div id="adminBadge" class="admin-only admin-active">
        🛡️ Admin Mode Active
        <button class="btn-danger btn-small" onclick="logoutAdmin()" style="margin-left: 5px;">Logout</button>
        <button class="btn-small" onclick="changePassword()" style="background: #6c757d;">Change Pass</button>
      </div>
    </div>
  </div>

  <!-- ADMIN ONLY: ADD CLIENT & SERVICE ADD OPTION DROPDOWN MANAGER -->
  <form id="clientForm" class="form-section admin-only">
    <h3>Admin Command: Add Client Profile</h3>
    
    <!-- SERVICE ADD OPTION DROPDOWN MANAGER -->
    <details style="margin: 15px 0; background: #eef7f9; padding: 12px; border-radius: 4px; border: 1px solid #bbeeef;">
      <summary>⚙️ Manage Services & Pricelist Options</summary>
      
      <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 10px; max-width: 600px;">
        <div style="display: flex; gap: 10px; align-items: center;">
          <select id="serviceSelectManager" onchange="loadSelectedServiceForEdit()" style="flex: 2;">
            <!-- Dynamic options populate here -->
          </select>
          <span style="font-size: 12px; color: #666; font-style: italic;">Select to edit or type below for new</span>
        </div>

        <div style="display: flex; gap: 10px;">
          <input type="text" id="newServiceName" placeholder="Service Title (e.g., Deep Clean)..." style="flex: 2;" onkeydown="handleServiceManagerEnter(event)" />
          <!-- Price Input (Numbers Only) -->
          <input type="text" id="newServicePrice" placeholder="Price (₱)..." style="flex: 1;" oninput="validateNumericInput(this)" onkeydown="handleServiceManagerEnter(event)" />
          <button type="button" style="background: #17a2b8; white-space: nowrap;" onclick="addNewServiceOption()">+ Add / Save Service Option</button>
        </div>
      </div>

      <div id="serviceTagContainer" class="service-tag-list"></div>
    </details>

    <div class="grid-4">
      <input type="text" id="name" placeholder="Client Name *" required />
      <input type="email" id="email" placeholder="Email (Optional)" />
      <input type="text" id="phone" placeholder="Phone (Optional)" />
      <input type="text" id="address" placeholder="Address (Optional)" />
    </div>

    <h4 style="margin: 10px 0 5px 0;">Services Provided</h4>
    <div id="servicesContainer">
      <div class="grid-service">
        <!-- Type-to-Search Service Selector -->
        <div>
          <input type="text" list="serviceOptionsList" class="svc-name" placeholder="Type to search service... *" onchange="autoFillPrice(this)" oninput="autoFillPrice(this)" required />
        </div>
        <!-- Date in mm/dd/yy format -->
        <input type="text" class="svc-manual-date" placeholder="Date (mm/dd/yy) *" maxlength="8" required />
        <!-- Price Input (Numbers Only) -->
        <input type="text" class="svc-amount" placeholder="Amount (₱) *" oninput="validateNumericInput(this)" required />
        <input type="text" class="svc-remark" placeholder="Remarks / Notes (Optional)" />
        <span></span>
      </div>
    </div>
    
    <!-- Global Datalist for Type-to-Search Filter -->
    <datalist id="serviceOptionsList"></datalist>
    
    <button type="button" class="btn-add-row" onclick="addServiceRow()">+ Add Service Field</button>

    <div class="actions">
      <button type="submit">Save Client Profile</button>
      <button type="button" class="btn-export" onclick="exportCSV()">Export Database (CSV)</button>
    </div>
  </form>

  <input type="text" id="searchInput" class="search-bar" placeholder="Search by name, address, service, or remarks..." onkeyup="renderClients()" />

  <table>
    <thead>
      <tr>
        <th>Client Name & Contact</th>
        <th>Address</th>
        <th>Services & Dates Log</th>
        <th>Remarks</th>
        <th>Total Revenue (PHP)</th>
        <th class="admin-only">Admin Actions</th>
      </tr>
    </thead>
    <tbody id="clientTableBody"></tbody>
  </table>
</div>

<script>
  if (!localStorage.getItem('sysAdminPass')) {
    localStorage.setItem('sysAdminPass', 'admin123');
  }

  if (!localStorage.getItem('sysServiceOptionsPHP')) {
    const defaultServices = [
      { name: 'Consultation', price: 500.00 },
      { name: 'Maintenance', price: 1500.00 },
      { name: 'Full Package', price: 5000.00 },
      { name: 'Repair', price: 1200.00 },
      { name: 'Inspection', price: 800.00 }
    ];
    localStorage.setItem('sysServiceOptionsPHP', JSON.stringify(defaultServices));
  }

  let isAdmin = false;

  // Strict Numbers Only Input Validator
  function validateNumericInput(input) {
    input.value = input.value.replace(/[^0-9.]/g, '');
    if ((input.value.match(/\./g) || []).length > 1) {
      input.value = input.value.replace(/\.+$/, '');
    }
  }

  // Handle Enter Key inside Service Manager Inputs
  function handleServiceManagerEnter(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      e.stopPropagation();
      addNewServiceOption();
    }
  }

  function getServiceOptions() {
    return JSON.parse(localStorage.getItem('sysServiceOptionsPHP') || '[]');
  }

  function saveServiceOptions(opts) {
    localStorage.setItem('sysServiceOptionsPHP', JSON.stringify(opts));
    populateAllDropdowns();
    renderServiceTags();
    populateServiceSelectManager();
  }

  function populateServiceSelectManager() {
    const opts = getServiceOptions();
    const managerSelect = document.getElementById('serviceSelectManager');
    if (!managerSelect) return;

    managerSelect.innerHTML = '<option value="">-- Select Existing Service Option --</option>' +
      opts.map(o => `<option value="${o.name}">${o.name} (₱${parseFloat(o.price).toLocaleString('en-PH', { minimumFractionDigits: 2 })})</option>`).join('');
  }

  function loadSelectedServiceForEdit() {
    const managerSelect = document.getElementById('serviceSelectManager');
    const selectedName = managerSelect.value;
    if (!selectedName) return;

    const opts = getServiceOptions();
    const found = opts.find(o => o.name === selectedName);
    if (found) {
      document.getElementById('newServiceName').value = found.name;
      document.getElementById('newServicePrice').value = found.price;
    }
  }

  function addNewServiceOption() {
    const nameInput = document.getElementById('newServiceName');
    const priceInput = document.getElementById('newServicePrice');
    const nameVal = nameInput.value.trim();
    const priceVal = parseFloat(priceInput.value) || 0;

    if (!nameVal) return alert('Enter a service title!');

    let opts = getServiceOptions();
    const existingIndex = opts.findIndex(o => o.name.toLowerCase() === nameVal.toLowerCase());

    if (existingIndex >= 0) {
      opts[existingIndex].price = priceVal;
    } else {
      opts.push({ name: nameVal, price: priceVal });
    }

    saveServiceOptions(opts);
    nameInput.value = '';
    priceInput.value = '';
    document.getElementById('serviceSelectManager').value = '';
  }

  function removeServiceOption(name) {
    let opts = getServiceOptions();
    opts = opts.filter(o => o.name !== name);
    saveServiceOptions(opts);
  }

  function renderServiceTags() {
    const opts = getServiceOptions();
    const container = document.getElementById('serviceTagContainer');
    container.innerHTML = opts.map(o => `
      <div class="service-tag">
        <strong>${o.name}</strong> (₱${parseFloat(o.price).toLocaleString('en-PH', { minimumFractionDigits: 2 })}) 
        <span onclick="removeServiceOption('${o.name}')">✕</span>
      </div>
    `).join('');
  }

  function populateAllDropdowns() {
    const opts = getServiceOptions();
    const dataList = document.getElementById('serviceOptionsList');
    if (dataList) {
      dataList.innerHTML = opts.map(o => `<option value="${o.name}">₱${parseFloat(o.price).toLocaleString('en-PH', { minimumFractionDigits: 2 })}</option>`).join('');
    }
  }

  function autoFillPrice(inputElem) {
    const opts = getServiceOptions();
    const selectedObj = opts.find(o => o.name.toLowerCase() === inputElem.value.trim().toLowerCase());
    if (selectedObj) {
      const row = inputElem.closest('.grid-service');
      const amountInput = row.querySelector('.svc-amount');
      amountInput.value = parseFloat(selectedObj.price).toFixed(2);
    }
  }

  function loginAdmin() {
    const input = document.getElementById('adminPassInput').value;
    const currentPass = localStorage.getItem('sysAdminPass');
    if (input === currentPass) {
      isAdmin = true;
      document.getElementById('adminPassInput').value = '';
      updateAdminUI();
    } else {
      alert('Incorrect Password!');
    }
  }

  function logoutAdmin() {
    isAdmin = false;
    updateAdminUI();
  }

  function changePassword() {
    const currentPass = localStorage.getItem('sysAdminPass');
    const oldP = prompt('Enter Current Password:');
    if (oldP === currentPass) {
      const newP = prompt('Enter New Password:');
      if (newP) {
        localStorage.setItem('sysAdminPass', newP);
        alert('Password successfully updated!');
      }
    } else {
      alert('Authentication failed.');
    }
  }

  function updateAdminUI() {
    const adminElements = document.querySelectorAll('.admin-only');
    const loginForm = document.getElementById('loginForm');
    
    adminElements.forEach(el => {
      el.style.display = isAdmin ? (el.tagName === 'TH' || el.tagName === 'TD' ? 'table-cell' : 'block') : 'none';
    });
    
    loginForm.style.display = isAdmin ? 'none' : 'flex';
    if (isAdmin) {
      renderServiceTags();
      populateServiceSelectManager();
    }
    renderClients();
  }

  function addServiceRow() {
    const row = document.createElement('div');
    row.className = 'grid-service';
    row.innerHTML = `
      <div>
        <input type="text" list="serviceOptionsList" class="svc-name" placeholder="Type to search service... *" onchange="autoFillPrice(this)" oninput="autoFillPrice(this)" required />
      </div>
      <input type="text" class="svc-manual-date" placeholder="Date (mm/dd/yy) *" maxlength="8" required />
      <input type="text" class="svc-amount" placeholder="Amount (₱) *" oninput="validateNumericInput(this)" required />
      <input type="text" class="svc-remark" placeholder="Remarks / Notes (Optional)" />
      <button type="button" class="btn-danger btn-small" onclick="this.parentElement.remove()">✕</button>
    `;
    document.getElementById('servicesContainer').appendChild(row);
  }

  function getClients() {
    return JSON.parse(localStorage.getItem('adminSecuredClients') || '[]');
  }

  function saveClients(clients) {
    localStorage.setItem('adminSecuredClients', JSON.stringify(clients));
  }

  function renderClients() {
    const clients = getClients();
    const query = document.getElementById('searchInput').value.toLowerCase();
    const tableBody = document.getElementById('clientTableBody');
    tableBody.innerHTML = '';

    const filtered = clients.filter(c => 
      c.name.toLowerCase().includes(query) ||
      (c.email && c.email.toLowerCase().includes(query)) ||
      (c.address && c.address.toLowerCase().includes(query)) ||
      c.services.some(s => s.name.toLowerCase().includes(query) || (s.remark && s.remark.toLowerCase().includes(query)))
    );

    filtered.forEach((c, index) => {
      let servicesHtml = '';
      let remarksHtml = '';
      let total = 0;

      c.services.forEach(s => {
        const amt = parseFloat(s.amount) || 0;
        total += amt;
        const formattedAmt = amt.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        servicesHtml += `<div class="service-item"><strong>${s.date || 'N/A'}</strong> — ${s.name} (₱${formattedAmt})</div>`;
        remarksHtml += `<div class="service-item">${s.remark ? s.remark : '<span class="text-muted">-</span>'}</div>`;
      });

      const formattedTotal = total.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const emailText = c.email ? `<small>${c.email}</small><br>` : '';
      const phoneText = c.phone ? `<small>${c.phone}</small>` : '';
      const addressText = c.address ? c.address : '<span class="text-muted">-</span>';
      const noContact = (!c.email && !c.phone) ? `<small class="text-muted">No contact info</small>` : '';

      const row = document.createElement('tr');
      row.innerHTML = `
        <td>
          <strong>${c.name}</strong><br>
          ${emailText}${phoneText}${noContact}
        </td>
        <td>${addressText}</td>
        <td>${servicesHtml}</td>
        <td>${remarksHtml}</td>
        <td><span class="total-badge">₱${formattedTotal}</span></td>
        ${isAdmin ? `
          <td>
            <button class="btn-small" onclick="appendServiceToClient(${index})">+ Add Service</button>
            <button class="btn-danger btn-small" onclick="deleteClient(${index})">Delete Profile</button>
          </td>
        ` : ''}
      `;
      tableBody.appendChild(row);
    });
  }

  function appendServiceToClient(index) {
    const opts = getServiceOptions();
    if (opts.length === 0) return alert('Please add service options in the Admin panel first.');

    const choiceText = opts.map((o, i) => `${i + 1}. ${o.name} (₱${parseFloat(o.price).toLocaleString('en-PH', { minimumFractionDigits: 2 })})`).join('\n');
    const selectedIdx = prompt(`Select Service Number:\n${choiceText}`);
    const chosenOpt = opts[parseInt(selectedIdx) - 1];

    if (!chosenOpt) return alert('Invalid Selection');
    
    const sDate = prompt('Enter Date (mm/dd/yy):', '09/01/26');
    if (!sDate) return;
    const sAmt = prompt('Enter Amount (₱):', chosenOpt.price);
    if (!sAmt) return;
    const sRemark = prompt('Enter Remarks / Notes (Optional):') || '';

    const clients = getClients();
    clients[index].services.push({ name: chosenOpt.name, date: sDate, amount: sAmt, remark: sRemark });
    saveClients(clients);
    renderClients();
  }

  document.getElementById('clientForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const clients = getClients();
    const serviceRows = document.querySelectorAll('#servicesContainer .grid-service');
    const services = [];

    serviceRows.forEach(row => {
      services.push({
        name: row.querySelector('.svc-name').value.trim(),
        date: row.querySelector('.svc-manual-date').value.trim(),
        amount: row.querySelector('.svc-amount').value,
        remark: row.querySelector('.svc-remark').value || ''
      });
    });

    clients.push({
      name: document.getElementById('name').value,
      email: document.getElementById('email').value || '',
      phone: document.getElementById('phone').value || '',
      address: document.getElementById('address').value || '',
      services: services
    });

    saveClients(clients);
    document.getElementById('clientForm').reset();
    
    const container = document.getElementById('servicesContainer');
    container.innerHTML = `
      <div class="grid-service">
        <div>
          <input type="text" list="serviceOptionsList" class="svc-name" placeholder="Type to search service... *" onchange="autoFillPrice(this)" oninput="autoFillPrice(this)" required />
        </div>
        <input type="text" class="svc-manual-date" placeholder="Date (mm/dd/yy) *" maxlength="8" required />
        <input type="text" class="svc-amount" placeholder="Amount (₱) *" oninput="validateNumericInput(this)" required />
        <input type="text" class="svc-remark" placeholder="Remarks / Notes (Optional)" />
        <span></span>
      </div>
    `;
    populateAllDropdowns();
    renderClients();
  });

  function deleteClient(index) {
    if (confirm('Are you sure you want to delete this client record?')) {
      const clients = getClients();
      clients.splice(index, 1);
      saveClients(clients);
      renderClients();
    }
  }

  function exportCSV() {
    const clients = getClients();
    if (clients.length === 0) return alert('No records to export.');

    let csv = 'Client Name,Email,Phone,Address,Service Date,Service Name,Amount (PHP),Remarks\n';
    clients.forEach(c => {
      c.services.forEach(s => {
        csv += `"${c.name}","${c.email || ''}","${c.phone || ''}","${c.address || ''}","${s.date}","${s.name}","${s.amount}","${s.remark || ''}"\n`;
      });
    });

    const blob = new Blob([csv], { type: 'text/csv' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.setAttribute('href', url);
    a.setAttribute('download', 'client_database_export_php.csv');
    a.click();
  }

  // Initial Boot
  populateAllDropdowns();
  populateServiceSelectManager();
  renderClients();
</script>

</body>
</html>
